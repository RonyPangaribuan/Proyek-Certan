[project]
name = "proyek-certan"
version = "0.1.0"
description = "Sistem Pendukung Keputusan Berbasis AI untuk Prioritisasi dan Penanganan Insiden Jaringan Kampus"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rony Reynaldy Pangaribuan", email = "ronypangaribuan2505@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
proyek-certan = "proyek_certan.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
